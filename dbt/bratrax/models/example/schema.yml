    - name: geo_report_table
      description: "Geographical distribution of advertising spend and revenue across platforms"
      meta:
          sql_where: "client_id = ${lightdash.attribute.organizationUuid}"
          group_details:
              "Spend Metrics": { order: 1 }
              "Lead Metrics": { order: 2 }
              "Financial Metrics": { order: 3 }
              "Performance Metrics": { order: 4 }
          metrics:
              cost_per_lead:
                  type: number
                  label: "Cost Per Lead (CPL)"
                  description: "Cost per lead calculated as total spend divided by total leads"
