version: 2

models:
    - name: orders
      label: Orders
      description: 'Orders data from production_tables.orders_table'
      meta:
          default_time_dimension:
            field: event_date  # ← Use created_at or event_date
            interval: DAY
          join_field: order_id
          sql_where: "client_id = ${lightdash.attribute.organizationUuid}"
      columns:
          - name: order_id
            description: 'Unique identifier for each order'
            tests:
                - not_null
            meta:
                dimension:
                    type: string
                    label: Order ID
                    hidden: false

          - name: customer_id
            description: 'Unique identifier for each customer'
            meta:
                dimension:
                    type: string

          - name: order_revenue
            description: 'Revenue amount for the order'
            meta:
                metrics:
                    total_revenue:
                        type: sum
                        label: Total Revenue
                        hidden: false

          - name: gross_revenue
            description: 'Gross revenue for the order'
            meta:
                metrics:
                    total_gross_revenue:
                        type: sum

          - name: net_revenue
            description: 'Net revenue for the order'
            meta:
                metrics:
                    total_net_revenue:
                        type: sum

          - name: created_at
            description: 'Timestamp when the order was created'
            meta:
                dimension:
                    type: timestamp
                    label: Created At
                    time_intervals: true
                    hidden: false

          - name: event_date
            description: 'Date of the order event'
            meta:
                dimension:
                    type: date
                    time_intervals:
                        - DAY
                        - WEEK
                        - MONTH
                        - YEAR

          - name: client_id
            description: 'Client identifier'
            meta:
                dimension:
                    type: string

          - name: write_key
            description: 'Write key'
            meta:
                dimension:
                    type: string

          - name: platform
            description: 'Platform information'
            meta:
                dimension:
                    type: string

          - name: order_name
            description: 'Order name'
