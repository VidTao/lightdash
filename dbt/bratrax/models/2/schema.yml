version: 2

models:
    - name: slack_allocation
      label: Slack Allocation
      description: 'Slack allocation tracking and budget management'
      meta:
          default_time_dimension:
              field: created_at
              interval: DAY
          sql_where: "client_id = ${lightdash.attribute.organizationUuid}"
      columns:
          - name: client_id
            description: 'Client identifier'
            meta:
                dimension:
                    type: string

          - name: bid
            description: 'Buyer ID'
            meta:
                dimension:
                    type: string

          - name: buyer_id
            description: 'Buyer identifier'
            meta:
                dimension:
                    type: string

          - name: allocation_id
            description: 'Allocation identifier'
            meta:
                dimension:
                    type: string

          - name: delivery_id
            description: 'Delivery identifier'
            meta:
                dimension:
                    type: string

          - name: channel
            description: 'Delivery channel'
            meta:
                dimension:
                    type: string

          - name: geos
            description: 'Geographical targeting'
            meta:
                dimension:
                    type: string

          - name: optional_tag
            description: 'Optional tag for categorization'
            meta:
                dimension:
                    type: string

          - name: status
            description: 'Delivery status'
            meta:
                dimension:
                    type: string

          - name: created_at
            description: 'Delivery creation timestamp'
            meta:
                dimension:
                    type: timestamp
                    time_intervals: true

          - name: created_by
            description: 'User who created the delivery'
            meta:
                dimension:
                    type: string

          - name: total_budget
            description: 'Total budget allocated'
            meta:
                metrics:
                    sum_total_budget:
                        type: sum
                        label: "Total Budget"
                        round: 2
                        format: "usd"
                dimension:
                    type: number

          - name: total_spent
            description: 'Total amount spent'
            meta:
                metrics:
                    sum_total_spent:
                        type: sum
                        label: "Total Spent"
                        round: 2
                        format: "usd"
                dimension:
                    type: number

          - name: available
            description: 'Available budget remaining'
            meta:
                metrics:
                    sum_available_budget:
                        type: sum
                        label: "Total Available"
                        round: 2
                        format: "usd"
                dimension:
                    type: number

    - name: slack_payment_allocation
      label: Slack Payment Allocation
      description: 'Junction table linking payments to allocations with allocation amounts'
      meta:
          default_time_dimension:
              field: created_at
              interval: DAY
          sql_where: "client_id = ${lightdash.attribute.organizationUuid}"
      columns:
          - name: client_id
            description: 'Client identifier'
            meta:
                dimension:
                    type: string

          - name: payment_delivery_id
            description: 'Unique payment delivery record identifier'
            meta:
                dimension:
                    type: string

          - name: payment_id
            description: 'Payment identifier'
            meta:
                dimension:
                    type: string

          - name: allocation_id
            description: 'Allocation identifier linking to delivery'
            meta:
                dimension:
                    type: string

          - name: amount
            description: 'Payment amount allocated to delivery'
            meta:
                metrics:
                    sum_payment_amount:
                        type: sum
                        label: "Total Payment Amount"
                        round: 2
                        format: "usd"
                    avg_payment_amount:
                        type: average
                        label: "Avg Payment Amount"
                        round: 2
                        format: "usd"
                dimension:
                    type: number

          - name: created_at
            description: 'Record creation timestamp'
            meta:
                dimension:
                    type: timestamp
                    time_intervals: true

          - name: created_by
            description: 'User who created the record'
            meta:
                dimension:
                    type: string

    - name: slack_payments
      label: Slack Payments
      description: 'Payment transaction records with fees and subscription tracking'
      meta:
          default_time_dimension:
              field: payment_date
              interval: DAY
          sql_where: "client_id = ${lightdash.attribute.organizationUuid}"
      columns:
          - name: client_id
            description: 'Client identifier'
            meta:
                dimension:
                    type: string

          - name: bid
            description: 'Buyer ID'
            meta:
                dimension:
                    type: string

          - name: buyer_id
            description: 'Buyer identifier'
            meta:
                dimension:
                    type: string

          - name: payment_id
            description: 'Unique payment identifier'
            meta:
                dimension:
                    type: string

          - name: payment_date
            description: 'Payment transaction date'
            meta:
                dimension:
                    type: timestamp
                    time_intervals: true

          - name: gross_amount
            description: 'Gross payment amount before fees'
            meta:
                metrics:
                    sum_gross_amount:
                        type: sum
                        label: "Total Gross Amount"
                        round: 2
                        format: "usd"
                    avg_gross_amount:
                        type: average
                        label: "Avg Gross Amount"
                        round: 2
                        format: "usd"
                dimension:
                    type: number

          - name: payment_type
            description: 'Type of payment'
            meta:
                dimension:
                    type: string

          - name: fee_percent
            description: 'Fee percentage applied to payment'
            meta:
                metrics:
                    avg_fee_percent:
                        type: average
                        label: "Avg Fee Percent"
                        round: 4
                dimension:
                    type: number

          - name: fee_amount
            description: 'Fee amount charged'
            meta:
                metrics:
                    sum_fee_amount:
                        type: sum
                        label: "Total Fee Amount"
                        round: 2
                        format: "usd"
                    avg_fee_amount:
                        type: average
                        label: "Avg Fee Amount"
                        round: 2
                        format: "usd"
                dimension:
                    type: number

          - name: net_amount
            description: 'Net payment amount after fees'
            meta:
                metrics:
                    sum_net_amount:
                        type: sum
                        label: "Total Net Amount"
                        round: 2
                        format: "usd"
                    avg_net_amount:
                        type: average
                        label: "Avg Net Amount"
                        round: 2
                        format: "usd"
                dimension:
                    type: number

          - name: payment_method
            description: 'Payment method used'
            meta:
                dimension:
                    type: string

          - name: invoice_number
            description: 'Invoice number reference'
            meta:
                dimension:
                    type: string

          - name: subscription_start_date
            description: 'Subscription period start date'
            meta:
                dimension:
                    type: timestamp
                    time_intervals: true

          - name: subscription_end_date
            description: 'Subscription period end date'
            meta:
                dimension:
                    type: timestamp
                    time_intervals: true

          - name: created_at
            description: 'Record creation timestamp'
            meta:
                dimension:
                    type: timestamp
                    time_intervals: true

          - name: created_by
            description: 'User who created the record'
            meta:
                dimension:
                    type: string

