version: 2

sources:
    # New bratrax-without-flattening project  
    - name: production_tables_no_flat
      description: 'Production tables from bratrax-without-flattening project'
      database: 'bratrax-without-flattening'
      schema: 'cod'
      tables:
          - name: slack_allocation
            description: 'Slack allocation tracking and budget management with client_id for multi-tenancy'
            columns:
              - name: client_id
                description: 'Client identifier for filtering (maps to organizationUuid)'
          - name: slack_payment_allocation
            description: 'Junction table linking payments to allocations with allocation amounts with client_id for multi-tenancy'
            columns:
              - name: client_id
                description: 'Client identifier for filtering (maps to organizationUuid)'
          - name: slack_payments
            description: 'Payment transaction records with fees and subscription tracking with client_id for multi-tenancy'
            columns:
              - name: client_id
                description: 'Client identifier for filtering (maps to organizationUuid)'
          - name: leadbyte_buyers_list
            description: 'Leadbyte buyers list with account and contact information with client_id for multi-tenancy'
            columns:
              - name: client_id
                description: 'Client identifier for filtering (maps to organizationUuid)'
          - name: leadbyte_deliveries_list
            description: 'Leadbyte deliveries list with campaign and buyer information with client_id for multi-tenancy'
            columns:
              - name: client_id
                description: 'Client identifier for filtering (maps to organizationUuid)'
          - name: leadbyte_suppliers_list
            description: 'Leadbyte suppliers list with account and contact information with client_id for multi-tenancy'
            columns:
              - name: client_id
                description: 'Client identifier for filtering (maps to organizationUuid)'
          - name: leadbyte_webhook_sold_unsold
            description: 'Leadbyte webhook sold/unsold lead tracking with supplier, buyer, campaign and delivery information with client_id for multi-tenancy'
            columns:
              - name: client_id
                description: 'Client identifier for filtering (maps to organizationUuid)'
          - name: leadbyte_webhook_valid_invalid
            description: 'Leadbyte webhook valid/invalid lead tracking with supplier and campaign information with client_id for multi-tenancy'
            columns:
              - name: client_id
                description: 'Client identifier for filtering (maps to organizationUuid)'
          - name: campaign_daily_metrics
            description: 'Daily performance metrics by campaign with client_id for multi-tenancy'
            columns:
              - name: client_id
                description: 'Client identifier for filtering (maps to organizationUuid)'
          - name: clients
            description: 'Client and buyer information with relationship types with client_id for multi-tenancy'
            columns:
              - name: client_id
                description: 'Client identifier for filtering (maps to organizationUuid)'
          - name: platform_campaigns
            description: 'Campaign configuration and budget management with client_id for multi-tenancy'
            columns:
              - name: client_id
                description: 'Client identifier for filtering (maps to organizationUuid)'

