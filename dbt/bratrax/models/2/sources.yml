version: 2

sources:
    # New bratrax-without-flattening project  
    - name: production_tables_no_flat
      description: 'Production tables from bratrax-without-flattening project'
      database: 'bratrax-without-flattening'
      schema: '2'
      tables:
          - name: slack_delivery
            description: 'Slack delivery tracking and budget management with client_id for multi-tenancy'
            columns:
              - name: client_id
                description: 'Client identifier for filtering (maps to organizationUuid)'
          - name: slack_payment_delivery
            description: 'Junction table linking payments to deliveries with allocation amounts with client_id for multi-tenancy'
            columns:
              - name: client_id
                description: 'Client identifier for filtering (maps to organizationUuid)'
          - name: slack_payments
            description: 'Payment transaction records with fees and subscription tracking with client_id for multi-tenancy'
            columns:
              - name: client_id
                description: 'Client identifier for filtering (maps to organizationUuid)'

