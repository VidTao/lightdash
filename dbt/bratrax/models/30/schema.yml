        meta:
          dimension:
            type: timestamp
            time_intervals: true
      - name: days_in_current_status
        description: 'Days in current status'
        meta:
          dimension:
            type: number
      - name: client_id
        description: 'Client identifier'
        meta:
          dimension:
            type: string

