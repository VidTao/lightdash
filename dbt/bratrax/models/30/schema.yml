version: 2

models:
  - name: pq_daily_metrics
    description: 'Daily North Star and 7 input metrics for Primal Queen Strategic Command'
    meta:
      label: 'Daily Metrics'
      group_label: 'Primal Queen'
      default_time_dimension:
        field: date
        interval: DAY
      sql_where: "client_id = ${lightdash.attribute.organizationUuid}"
    columns:
      - name: date
        description: 'Date of the metrics'
        meta:
          dimension:
            type: date
            time_intervals: true
      - name: contribution_margin
        description: 'North Star - Revenue minus all variable costs'
        meta:
          metrics:
            contribution_margin_total:
              type: sum
              label: 'Contribution Margin'
              format: 'usd'
              round: 2
            contribution_margin_avg:
              type: average
              label: 'Avg Daily Contribution Margin'
              format: 'usd'
              round: 2
          dimension:
            type: number
      - name: contribution_margin_pct_change
        description: 'Percentage change in contribution margin'
        meta:
          dimension:
            type: number
      - name: revenue
        description: 'Daily gross revenue'
        meta:
          metrics:
            revenue_total:
              type: sum
              label: 'Revenue'
              format: 'usd'
              round: 2
          dimension:
            type: number
      - name: gross_margin_pct
        description: 'Gross margin percentage'
        meta:
          metrics:
            gross_margin_avg:
              type: average
              label: 'Gross Margin %'
              format: 'percent'
          dimension:
            type: number
      - name: cac
        description: 'Customer Acquisition Cost (Extremistan)'
        meta:
          metrics:
            cac_avg:
              type: average
              label: 'CAC'
              format: 'usd'
              round: 2
          dimension:
            type: number
      - name: ltv_cac_ratio
        description: 'LTV to CAC ratio'
        meta:
          metrics:
            ltv_cac_avg:
              type: average
              label: 'LTV:CAC Ratio'
              format: 'number'
          dimension:
            type: number
      - name: payback_months
        description: 'Months to payback CAC'
        meta:
          metrics:
            payback_avg:
              type: average
              label: 'Payback (months)'
              format: 'number'
          dimension:
            type: number
      - name: mrr
        description: 'Monthly Recurring Revenue'
        meta:
          metrics:
            mrr_latest:
              type: max
              label: 'MRR'
              format: 'usd'
              round: 2
          dimension:
            type: number
      - name: churn_rate_pct
        description: 'Subscription churn rate'
        meta:
          metrics:
            churn_avg:
              type: average
              label: 'Churn Rate %'
              format: 'percent'
          dimension:
            type: number
      - name: new_customers
        description: 'New customers acquired'
        meta:
          metrics:
            new_customers_total:
              type: sum
              label: 'New Customers'
          dimension:
            type: number
      - name: returning_customers
        description: 'Returning customers'
        meta:
          metrics:
            returning_customers_total:
              type: sum
              label: 'Returning Customers'
          dimension:
            type: number
      - name: total_orders
        description: 'Total orders'
        meta:
          metrics:
            orders_total:
              type: sum
              label: 'Total Orders'
          dimension:
            type: number
      - name: aov
        description: 'Average Order Value'
        meta:
          metrics:
            aov_avg:
              type: average
              label: 'AOV'
              format: 'usd'
              round: 2
          dimension:
            type: number
      - name: ad_spend
        description: 'Daily ad spend'
        meta:
          metrics:
            ad_spend_total:
              type: sum
              label: 'Ad Spend'
              format: 'usd'
              round: 2
          dimension:
            type: number
      - name: cogs
        description: 'Cost of goods sold'
        meta:
          metrics:
            cogs_total:
              type: sum
              label: 'Total COGS'
              format: 'usd'
              round: 2
          dimension:
            type: number
      - name: fulfillment_cost
        description: 'Fulfillment costs'
        meta:
          metrics:
            fulfillment_cost_total:
              type: sum
              label: 'Total Fulfillment Cost'
              format: 'usd'
              round: 2
          dimension:
            type: number
      - name: cac_domain
        description: 'Taleb domain classification for CAC'
        meta:
          dimension:
            type: string
      - name: revenue_domain
        description: 'Taleb domain classification for Revenue'
        meta:
          dimension:
            type: string
      - name: revenue_bets
        description: 'Active revenue bets'
        meta:
          dimension:
            type: string
      - name: cac_bets
        description: 'Active CAC bets'
        meta:
          dimension:
            type: string
      - name: mrr_bets
        description: 'Active MRR bets'
        meta:
          dimension:
            type: string
      - name: churn_bets
        description: 'Active churn bets'
        meta:
          dimension:
            type: string
      - name: client_id
        description: 'Client identifier'
        meta:
          dimension:
            type: string

  - name: pq_customers
    description: 'Customer master data with lifetime metrics'
    meta:
      label: 'Customers'
      group_label: 'Primal Queen'
      default_time_dimension:
        field: created_at
        interval: DAY
      sql_where: "client_id = ${lightdash.attribute.organizationUuid}"
    columns:
      - name: customer_id
        description: 'Unique customer identifier'
        meta:
          dimension:
            type: string
      - name: email
        description: 'Customer email address'
        meta:
          dimension:
            type: string
      - name: first_name
        description: 'Customer first name'
        meta:
          dimension:
            type: string
      - name: last_name
        description: 'Customer last name'
        meta:
          dimension:
            type: string
      - name: created_at
        description: 'Customer account creation timestamp'
        meta:
          dimension:
            type: timestamp
            time_intervals: true
      - name: first_order_date
        description: 'Date of first order'
        meta:
          dimension:
            type: date
            time_intervals: true
      - name: is_subscriber
        description: 'Whether customer has subscription'
        meta:
          dimension:
            type: boolean
      - name: subscription_status
        description: 'Subscription status'
        meta:
          dimension:
            type: string
      - name: country_code
        description: 'Country code'
        meta:
          dimension:
            type: string
      - name: state_code
        description: 'State code'
        meta:
          dimension:
            type: string
      - name: city
        description: 'City'
        meta:
          dimension:
            type: string
      - name: total_orders
        description: 'Customer lifetime orders'
        meta:
          metrics:
            customer_orders_avg:
              type: average
              label: 'Avg Orders per Customer'
          dimension:
            type: number
      - name: total_revenue
        description: 'Customer lifetime revenue'
        meta:
          metrics:
            customer_revenue_avg:
              type: average
              label: 'Avg Revenue per Customer'
              format: 'usd'
              round: 2
            customer_revenue_total:
              type: sum
              label: 'Total Customer Revenue'
              format: 'usd'
              round: 2
          dimension:
            type: number
      - name: ltv
        description: 'Customer lifetime value'
        meta:
          metrics:
            ltv_avg:
              type: average
              label: 'Average LTV'
              format: 'usd'
              round: 2
          dimension:
            type: number
      - name: acquisition_channel
        description: 'Channel that acquired customer'
        meta:
          dimension:
            type: string
      - name: acquisition_campaign
        description: 'Campaign that acquired customer'
        meta:
          dimension:
            type: string
      - name: first_touch_source
        description: 'First touch source'
        meta:
          dimension:
            type: string
      - name: client_id
        description: 'Client identifier'
        meta:
          dimension:
            type: string

