    description: Unique session identifier (activity_id)
    meta:
      metrics:
        session_count:
          type: count
  - name: session_started_at
    description: Session start timestamp
    meta:
      dimension:
        type: timestamp
        time_intervals:
        - DAY
        - WEEK
        - MONTH
  - name: visitor_id
    description: Customer who started the session
  - name: client_id
    description: Client identifier
  - name: anonymous_id
    description: Anonymous visitor identifier
  - name: utm_source
    description: UTM source parameter
  - name: utm_medium
    description: UTM medium parameter
  - name: utm_campaign
    description: UTM campaign parameter
  - name: utm_content
    description: UTM content parameter
  - name: utm_term
    description: UTM term parameter
  - name: referrer
    description: HTTP referrer URL
